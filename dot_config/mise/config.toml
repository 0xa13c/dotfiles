[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.mise_shell_activate]
zprofile = "shims"

[bootstrap.mise_shell_activate.zsh]
enabled = true

[bootstrap.mise_shell_activate.bash]
enabled = true

[bootstrap.mise_shell_activate.fish]
enabled = true

[bootstrap.hooks.final]
run = '''
ZSHRC="$HOME/.zshrc"
if grep -qF "# >>> mise bootstrap: shell init" "$ZSHRC" 2>/dev/null; then
    echo "shell init: already wired"
else
    cat >> "$ZSHRC" <<'RC'

# >>> mise bootstrap: shell init >>>
[-d $HOME/.local/opt/brew/share/zsh/site-functions ] && fpath+=("$HOME/.local/opt/brew/share/zsh/site-functions")
[-d /usr/share/zsh/site-functions ] && fpath+=("/usr/share/zsh/site-functions")
[-d /usr/share/zsh/vendor-completions ] && fpath+=("/usr/share/zsh/vendor-completions")
[-d "$HOME/.docker/completions/zsh" ] && fpath+=("$HOME/.docker/completions/zsh")
[-d "$HOME/.local/share/chezmoi" ] && fpath+=("$HOME/.local/share/chezmoi")

# export ZSH="${ZSH:-$HOME}"


command -v rbenv  >/dev/null && eval "$(rbenv init - zsh)"
command -v direnv >/dev/null && eval "$(direnv hook zsh)"

# sheldon — plugin manager (oh-my-zsh)
command -v sheldon > /dev/null && eval "$(sheldon source)"

# zoxide — smarter cd (replaces z). Provides `z` and `zi`.
command -v zoxide > /dev/null && eval "$(zoxide init zsh)"

command -v starship > /dev/null && eval "$(starship init zsh)"


#source 
# build array of environment config files for sourcing

typeset -ga sources
sources+="$HOME/.dotfiles/aliases.zsh"
sources+="$HOME/.atuin/bin/env" 

# include sources

foreach file (`echo $sources`)
    if [[ -a $file ]]; then
        source $file
    fi
end

#Config Atuin 
command -v atuin > /dev/null && eval "$(atuin init zsh)"

# HELPERS
# ----------------------------------------------------------------
# Avoid duplicating entry "$1" whenever add it to "$PATH"
function add_to_PATH {
  case ":$PATH:" in
    *":$1:"*) :;;           # already there.
    *) PATH="$1:$PATH";;    # prefer custom $1 first.
  esac
}

# ----------------------------------------------------------------
# ALIASES
# ----------------------------------------------------------------
alias find=fd
alias lg=lazygit
alias n=nvim
# ----------------------------------------------------------------
 ENVIRONMENTS
# ----------------------------------------------------------------
add_to_PATH "$HOME/.local/bin"
add_to_PATH "$HOME/bin/"
add_to_PATH "$HOME/Apps"
add_to_PATH "$HOME/.bin"

# PNPM.
export PNPM_HOME="$HOME/.local/share/pnpm"
add_to_PATH "$PNPM_HOME"

# Yarn.
add_to_PATH "$(yarn global bin)"


# Generated for envman. Do not edit.
# [ -s "$HOME/.config/envman/load.sh" ] && source "$HOME/.config/envman/load.sh"

# Generated by Webi. Do not edit.


#[ -f ~/.fzf.zsh ] && source ~/.fzf.zsh

# Load after Atuin so fzf handles Ctrl+R.
# Ctrl+T: select files; Ctrl+R: search history; Alt+C: change directory.
if [[ -o interactive ]] && command -v fzf > /dev/null; then
    source <(fzf --zsh)
fi


