# -----------------------mise-config.toml-----------------------

min_version = "26.9.11"

# Mask these in captured task output. (Does not encrypt!) This is useful for sensitive information like passwords or API keys.
redactions = [
    "*_ACCESS_KEY",
    "*_ACCESS_TOKEN",
    "*_API_KEY",
    "*_AUTH_HEADER",
    "*_SECRET_KEY",
    "*_SECRET_TOKEN",
]

[settings]
experimental = true

[settings.upgrade]
auto_prune = false

[settings.age]
ssh_identity_files = [ "~/.ssh/mise_private_key"]

